name: Test Linux

on:
  push:
    branches:
      - main

concurrency:
  group: test-linux-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: "0"
      ELECTRON_DISABLE_SANDBOX: "1"
      ELECTRON_ENABLE_LOGGING: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Build
        run: pnpm run build

      - name: Unit tests
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck

      - name: Install Electron system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          for pkg in \
            libgtk-3-0t64 libgtk-3-0 \
            libnss3 \
            libgbm1 \
            libxss1 \
            libasound2t64 libasound2 \
            libatk-bridge2.0-0t64 libatk-bridge2.0-0 \
            libatk1.0-0t64 libatk1.0-0 \
            libcups2t64 libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libx11-xcb1 \
            libxcb-dri3-0 \
            libxshmfence1 \
            libpango-1.0-0 \
            libcairo2 \
            libnotify4 \
            libxtst6 \
            dbus-x11 \
            fonts-liberation
          do
            sudo apt-get install -y "$pkg" || true
          done

      - name: Electron e2e
        run: xvfb-run --auto-servernum pnpm example:electron:e2e
