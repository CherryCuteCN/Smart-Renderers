name: CI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
          cache: pnpm

      - name: Get the release tag
        id: get_tag
        run: |
          TAG_NAME=${GITHUB_REF##*/}
          VERSION=${TAG_NAME#v}
          echo "RELEASE_TAG=$VERSION" >> "$GITHUB_ENV"
          echo "Publishing version: $VERSION"

      - name: Update package.json version with release tag
        run: |
          pnpm pkg set version="$RELEASE_TAG"
          echo "Updated package.json:"
          cat package.json

      - name: Install dependencies
        run: pnpm install

      - name: Build main package
        run: pnpm run build

      - name: Configure npm auth
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          TOKEN="${NODE_AUTH_TOKEN#"${NODE_AUTH_TOKEN%%[![:space:]]*}"}"
          TOKEN="${TOKEN%"${TOKEN##*[![:space:]]}"}"
          if [ -z "$TOKEN" ]; then
            echo "NPM_TOKEN secret is empty." >&2
            echo "Create a Granular Access Token with Read and write, Bypass 2FA, All packages, and Allow publishing new packages." >&2
            exit 1
          fi
          echo "token_length=${#TOKEN}"
          echo "token_prefix=${TOKEN:0:4}"
          umask 077
          printf '//registry.npmjs.org/:_authToken=%s\nregistry=https://registry.npmjs.org/\n' "$TOKEN" > .npmrc
          npm whoami

      - name: Publish to npm
        run: |
          pnpm pkg delete devEngines
          npm publish --ignore-scripts --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
