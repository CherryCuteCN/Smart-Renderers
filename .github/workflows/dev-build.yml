name: Dev Build

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
          cache: pnpm

      - name: Update package.json version with timestamp for dev build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TIMESTAMP=$(date +%s)
          TAG=""
          if TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name); then
            TAG=${TAG#v}
          else
            TAG=""
          fi
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            VERSION="${TAG}-dev.${TIMESTAMP}"
          else
            VERSION="0.0.0-dev.${TIMESTAMP}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$ ]]; then
            echo "Refusing to publish invalid version: $VERSION" >&2
            exit 1
          fi
          pnpm pkg set version="$VERSION"
          echo "Updated package.json to dev version $VERSION:"
          cat package.json

      - name: Install dependencies
        run: pnpm install

      - name: Build main package
        run: pnpm run build

      - name: Publish to npm with dev tag
        run: pnpm publish . --no-git-checks --access public --tag dev
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
