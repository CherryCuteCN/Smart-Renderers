name: Dev Build

on:
  workflow_run:
    workflows:
      - Test Linux
      - Test Windows
      - Test macOS
    types:
      - completed
    branches:
      - main

concurrency:
  group: dev-build-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  wait-for-platform-tests:
    name: Wait for platform tests
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    outputs:
      ready: ${{ steps.gate.outputs.ready }}
    steps:
      - name: Confirm Linux, Windows, and macOS tests succeeded
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          ready=true
          for name in "Test Linux" "Test Windows" "Test macOS"; do
            json=$(gh run list \
              --repo "$GITHUB_REPOSITORY" \
              --workflow "$name" \
              --commit "$SHA" \
              --limit 5 \
              --json conclusion,status,createdAt)
            conclusion=$(echo "$json" | jq -r 'sort_by(.createdAt) | last | .conclusion // empty')
            status=$(echo "$json" | jq -r 'sort_by(.createdAt) | last | .status // empty')
            echo "$name: status=$status conclusion=$conclusion"
            if [[ "$conclusion" != "success" ]]; then
              ready=false
            fi
          done
          echo "ready=$ready" >> "$GITHUB_OUTPUT"
          if [[ "$ready" != "true" ]]; then
            echo "Not all platform tests have succeeded for $SHA yet."
          fi

  build:
    needs: wait-for-platform-tests
    if: needs.wait-for-platform-tests.outputs.ready == 'true'
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.22.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org/"
          cache: pnpm

      - name: Update package.json version with timestamp for dev build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TIMESTAMP=$(date +%s)
          TAG=""
          if TAG=$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq .tag_name); then
            TAG=${TAG#v}
          else
            TAG=""
          fi
          if [[ "$TAG" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            VERSION="${TAG}-dev.${TIMESTAMP}"
          else
            VERSION="0.0.0-dev.${TIMESTAMP}"
          fi
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-dev\.[0-9]+$ ]]; then
            echo "Refusing to publish invalid version: $VERSION" >&2
            exit 1
          fi
          pnpm pkg set version="$VERSION"
          echo "Updated package.json to dev version $VERSION:"
          cat package.json

      - name: Install dependencies
        run: pnpm install

      - name: Build main package
        run: pnpm run build

      - name: Publish to npm with dev tag
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN secret is empty." >&2
            exit 1
          fi
          umask 077
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NODE_AUTH_TOKEN" > .npmrc
          pnpm publish . --no-git-checks --access public --tag dev
