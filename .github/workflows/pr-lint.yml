name: Lint

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: pr-lint-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    env:
      HUSKY: "0"
      NO_COLOR: "1"
      FORCE_COLOR: "0"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Run lint
        id: lint
        continue-on-error: true
        run: |
          set -o pipefail
          pnpm lint 2>&1 | tee lint-output.txt

      - name: Upsert lint comment
        if: ${{ !cancelled() }}
        uses: actions/github-script@v7
        env:
          LINT_OUTCOME: ${{ steps.lint.outcome }}
        with:
          script: |
            const fs = require("node:fs");
            const marker = "<!-- smart-renderers-pr-lint -->";
            const failed = process.env.LINT_OUTCOME === "failure";
            const max = 60_000;
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            let output = "";
            try {
              output = fs.readFileSync("lint-output.txt", "utf8").trim();
            } catch {
              output = "";
            }
            if (output.length > max) {
              output = `${output.slice(0, max)}\n…(truncated)`;
            }
            if (!output) {
              output = failed ? "Lint failed, but no output was captured." : "";
            }

            const body = failed
              ? [
                  marker,
                  "## Lint",
                  "",
                  "Failed. Merge is blocked until lint passes.",
                  "",
                  "````text",
                  output,
                  "````",
                  "",
                ].join("\n")
              : [
                  marker,
                  "## Lint",
                  "",
                  "Looks good. This PR is ready to merge.",
                  "",
                ].join("\n");

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number,
            });
            const existing = comments.find(
              (comment) =>
                comment.user?.login === "github-actions[bot]" &&
                comment.body?.includes(marker),
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body,
              });
            }

      - name: Fail if lint failed
        if: steps.lint.outcome == 'failure'
        run: exit 1
